name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push:
        description: "Push the image to ghcr.io/polimo-dev/prompton-docs"
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/polimo-dev/prompton-docs
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'workflow_dispatch' && inputs.push == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCS_URL=https://docs.prompton.ai
            APP_URL=https://app.prompton.ai
            HOME_URL=https://prompton.ai
          cache-from: type=gha
          cache-to: type=gha,mode=max
